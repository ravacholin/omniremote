name: Android release firmado

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_CERT_SHA256: ed79a1a3dd6b8be123889b95aa90b6ed48c540ed9c1d8794364968d2311fb010
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Instalar Android SDK
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
          gradle-version: "9.3.1"
      - name: Compilar y verificar la firma de distribución
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.OMNIREMOTE_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.OMNIREMOTE_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_KEYSTORE_B64" || -z "$STORE_PASSWORD" ]]; then
            echo "::error::Faltan los secretos de firma de OMNIREMOTE."
            exit 1
          fi
          umask 077
          signing_dir=$(mktemp -d)
          trap 'rm -rf -- "$signing_dir"' EXIT
          export KEYSTORE_PATH="$signing_dir/omniremote-release.p12"
          export KEY_PASSWORD="$STORE_PASSWORD"
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          unset RELEASE_KEYSTORE_B64

          certificate=$(keytool -exportcert -alias upload -keystore "$KEYSTORE_PATH" -storepass:env STORE_PASSWORD |
            sha256sum | cut -d ' ' -f 1)
          if [[ "$certificate" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::El certificado del keystore no coincide con la firma de distribución de Omniremote."
            exit 1
          fi
          gradle --no-daemon --no-configuration-cache assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          signature=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk")
          printf '%s\n' "$signature" | grep -Fx "Signer #1 certificate SHA-256 digest: $EXPECTED_CERT_SHA256"
      - name: Guardar APK de distribución
        uses: actions/upload-artifact@v5
        with:
          name: omniremote-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
